[project]
name = "crossroads-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20", "minio>=7.2,<8", "pillow>=11,<13",
  "typer>=0.15,<1", "httpx>=0.28,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["market"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
