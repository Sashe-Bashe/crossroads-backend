name: crossroads
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market-local}
      POSTGRES_DB: market
    ports: ["127.0.0.1:${POSTGRES_PORT:-55433}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 3s
      timeout: 3s
      retries: 30
  minio:
    image: crossroads-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: docker/MinIO.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-market-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-market-local-storage-password}
    ports: ["127.0.0.1:${MINIO_PORT:-9100}:9000", "127.0.0.1:9101:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    image: crossroads-api:local
    build: .
    env_file: .env
    environment: &backend-environment
      DATABASE_URL: postgresql+psycopg://market:${POSTGRES_PASSWORD:-market-local}@postgres:5432/market
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && python -m market.manage storage-init"]
  api:
    image: crossroads-api:local
    build: .
    env_file: .env
    environment: *backend-environment
    ports: ["127.0.0.1:${API_PORT:-8100}:8100"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["uvicorn", "market.main:app", "--host", "0.0.0.0", "--port", "8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    image: crossroads-api:local
    build: .
    env_file: .env
    environment: *backend-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["python", "-m", "market.worker"]
    restart: unless-stopped
  frontend:
    image: crossroads-frontend:local
    build: ../frontend
    environment:
      API_INTERNAL_URL: http://api:8100
    ports: ["127.0.0.1:${FRONTEND_PORT:-3100}:3100"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
  minio-data:
