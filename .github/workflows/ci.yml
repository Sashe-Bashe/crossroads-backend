name: backend
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait postgres minio
      - run: uv sync --frozen
      - run: uv run ruff check market tests scripts && uv run ruff format --check market tests scripts
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q
      - run: uv run python scripts/export_openapi.py && git diff --exit-code -- docs/openapi.json
      - if: always()
        run: docker compose logs --tail=60 postgres minio
